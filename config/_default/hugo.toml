baseURL = "https://hsmint.github.io/"
theme = "blowfish"
defaultContentLanguage = "en"

enableRobotsTXT = true
summaryLength = 0

buildDrafts = false
buildFuture = false

enableEmoji = true

# Disqus comments (rendered via layouts/partials/comments.html)
disqusShortname = "hsmints-blog"

# Your old ID was Universal Analytics (UA-171554028-1), which Google shut down
# in July 2023 and Hugo no longer emits. Create a GA4 property and put the
# G-XXXXXXXXXX ID here to re-enable analytics.
# googleAnalytics = "G-XXXXXXXXXX"

[pagination]
  pagerSize = 6

[imaging]
  anchor = 'Center'

[taxonomies]
  tag = "tags"
  category = "categories"
  series = "series"

[sitemap]
  changefreq = 'daily'
  filename = 'sitemap.xml'
  priority = 0.5

[outputs]
  home = ["HTML", "RSS", "JSON"]

[related]
  threshold = 0
  toLower = false

  [[related.indices]]
    name = "tags"
    weight = 100

  [[related.indices]]
    name = "categories"
    weight = 100

  [[related.indices]]
    name = "series"
    weight = 50

  [[related.indices]]
    name = "date"
    weight = 10

  [[related.indices]]
    applyFilter = false
    name = 'fragmentrefs'
    type = 'fragments'
    weight = 10
